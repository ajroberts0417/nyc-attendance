name: Collect attendance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/collect.mjs
      - name: Commit if changed
        run: |
          git config user.name "attendance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            # GitHub pauses scheduled workflows after 60 days without commits (e.g. summer break).
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
              git commit --allow-empty -m "Keepalive" && git push
            fi
            echo "No changes"; exit 0
          fi
          git commit -m "Attendance $(ls data/days | tail -1 | sed 's/.csv//') — $(date -u +%FT%TZ)"
          git push
